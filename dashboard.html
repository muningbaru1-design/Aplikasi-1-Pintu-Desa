<!DOCTYPE html>
<html lang="id">

<head>

    <link rel="stylesheet" href="css/sidebar.css">

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>
        Aplikasi 1 Pintu Desa Muning Baru
    </title>


    <!-- =========================
         MANIFEST PWA
    ========================= -->

    <link rel="manifest"
          href="./manifest.json">


    <!-- WARNA APLIKASI -->

    <meta name="theme-color"
          content="#2563eb">


    <!-- =========================
         BOOTSTRAP ICONS
    ========================= -->

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- =========================
         GOOGLE FONT
    ========================= -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- =========================
         CSS UTAMA
    ========================= -->

    <link rel="stylesheet"
          href="css/style.css">


</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="header">


        <button
            class="menu-btn">


            <i
                class="bi bi-list">


            </i>


        </button>


        <div
            class="title">


            <h2>


                Aplikasi 1 Pintu


            </h2>


            <p>


                Desa Muning Baru


            </p>


        </div>


        <img
            src="assets/logo/logo-desa.jpg"
            class="logo"
            alt="Logo Desa Muning Baru">


    </header>


    <!-- =========================
         GRID MENU
    ========================= -->

    <section
        id="gridMenu"
        class="grid-menu">


    </section>


    <!-- =========================
         JAVASCRIPT DATA
    ========================= -->

    <script
        src="js/data.js">


    </script>


    <!-- =========================
         JAVASCRIPT MENU
    ========================= -->

    <script
        src="js/menu.js">


    </script>


    <!-- =========================
         JAVASCRIPT APLIKASI
    ========================= -->

    <script
        src="js/app.js">


    </script>


    <!-- =========================
         LOGIN CHECK
    ========================= -->

    <script>


        const userLogin =

            sessionStorage.getItem(
                "userLogin"
            );


        if (!userLogin) {


            window.location.href =
                "index.html";


        }


    </script>


    <!-- =========================
         SERVICE WORKER
    ========================= -->

    <script>


        if (

            "serviceWorker"

            in

            navigator

        ) {


            window.addEventListener(

                "load",

                function () {


                    navigator.serviceWorker.register(

                        "./service-worker.js"

                    )


                    .then(

                        function (

                            registration

                        ) {


                            console.log(

                                "Service Worker aktif:",

                                registration.scope

                            );


                        }

                    )


                    .catch(

                        function (

                            error

                        ) {


                            console.error(

                                "Service Worker gagal:",

                                error

                            );


                        }

                    );


                }

            );


        }


    </script>

    <script src="js/sidebar.js"></script>
    <button id="sidebarToggle">
    <i class="bi bi-list"></i>
</button>

<div id="sidebarOverlay"></div>


</body>


</html>
