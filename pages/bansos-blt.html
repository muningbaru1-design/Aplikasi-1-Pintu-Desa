<!DOCTYPE html>
<html lang="id">

<head>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"

    <style>

        * {

        }

        body {

            margin: 0;

        /* =========================

        ========================= */

           STATISTIK
        ========================= */

        .stats {

        }


        .stat-card {

        }


        .stat-card h2 {

        }


        .stat-card p {

        /* =========================
           TOOLBAR
        ========================= */

        .toolbar {

        .btn {

</head>


<body>

<div

<script>


/* =========================================
   URL GOOGLE SHEETS CSV
========================================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vTxVOzFyCaLXsc8LmOcjwawX3XPWmdpThRZO3ezWVrM9Z2r6ztk8A610oC5-mUQo8cZelkVWx4hdyOu/pub?gid=1000735722&single=true&output=csv";


/* =========================================
   URL GOOGLE APPS SCRIPT
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxB6Mdhpm_vTCZuZ3mpYoFg8n9pRtVXDDhdCOn-1Gc5oCSA2NqgdLIviejvCHSEooSVWg/exec";

const PROGRAM = "blt";


/* =========================================
   DATA
========================================= */

let dataBLT = [];

let dataTampil = [];

let halaman = 1;

const perHalaman = 10;


/* =========================================
   ELEMENT
========================================= */

const tabel =
document.getElementById("tabelBLT");

const searchInput =
document.getElementById("searchInput");


/* =========================================
   PARSER CSV
========================================= */

function parseCSV(csv) {

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for (
        let i = 0;
        i < csv.length;
        i++
    ) {

        const char = csv[i];

        const next =
            csv[i + 1];


        if (
            char === '"' &&
            insideQuotes &&
            next === '"'
        ) {

            value += '"';

            i++;

            continue;

        }


        if (char === '"') {

            insideQuotes =
                !insideQuotes;

            continue;

        }


        if (
            char === "," &&
            !insideQuotes
        ) {

            row.push(value.trim());

            value = "";

            continue;

        }


        if (
            (
                char === "\n" ||
                char === "\r"
            )
            &&
            !insideQuotes
        ) {

            if (
                char === "\r" &&
                next === "\n"
            ) {

                i++;

            }


            row.push(value.trim());

            value = "";


            if (
                row.some(
                    cell => cell !== ""
                )
            ) {

                rows.push(row);

            }


            row = [];

            continue;

        }


        value += char;

    }


    if (
        value !== "" ||
        row.length > 0
    ) {

        row.push(value.trim());

        rows.push(row);

    }


    if (rows.length < 2) {

        return [];

    }


    const headers =
        rows[0].map(
            header =>
                header
                .trim()
                .toLowerCase()
        );


    return rows
        .slice(1)
        .map(
            (columns, index) => {

                const obj = {};

                headers.forEach(
                    (header, i) => {

                        obj[header] =
                            columns[i]
                            || "";

                    }
                );


                return {

                    nik:
                        obj["nik"]
                        || "",

                    kk:
                        obj["no. kk"]
                        || obj["no kk"]
                        || obj["kk"]
                        || "",

                    nama:
                        obj["nama penerima"]
                        || obj["nama"]
                        || "",

                    alamat:
                        obj["alamat"]
                        || "",

                    rt:
                        obj["rt"]
                        || "",

                    status:
                        obj["status"]
                        || "Aktif",

                    keterangan:
                        obj["keterangan"]
                        || "",

                    _row:
                        index + 2

                };

            }
        );

}


/* =========================================
   AMBIL DATA
========================================= */

async function ambilDataBLT() {

    tampilLoading();


    try {

        /*
         * Tambahkan timestamp agar browser
         * tidak menggunakan cache lama.
         */

        const url =
            CSV_URL +
            "&t=" +
            Date.now();


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "CSV gagal dimuat"
            );

        }


        const csv =
            await response.text();


        dataBPNT =
            parseCSV(csv);


        dataTampil =
            [...dataBLT];


        halaman = 1;


        updateStatistik();

        tampilkanData();


    } catch (error) {

        console.error(error);


        tabel.innerHTML = `

            <tr>

                <td colspan="9">

                    <div class="empty">

                        <i class="bi bi-exclamation-triangle"></i>

                        <h3>
                            Data gagal dimuat
                        </h3>

                        <p>
                            Periksa koneksi Google Sheets.
                        </p>

                    </div>

                </td>

            </tr>

        `;

    }

}


/* =========================================
   LOADING
========================================= */

function tampilLoading() {

    tabel.innerHTML = `

        <tr>

            <td colspan="9">

                <div class="loading">

                    <i class="bi bi-arrow-repeat"></i>

                    <p>
                        Memuat data...
                    </p>

                </div>

            </td>

        </tr>

    `;

}


/* =========================================
   STATISTIK
========================================= */

function updateStatistik() {

    const total =
        dataBLT.length;


    const aktif =
        dataBLT.filter(
            item =>
                String(item.status)
                .toLowerCase()
                .includes("aktif")
                &&
                !String(item.status)
                .toLowerCase()
                .includes("tidak")
        ).length;


    const tidakAktif =
        dataBLT.filter(
            item =>
                String(item.status)
                .toLowerCase()
                .includes("tidak")
        ).length;


    document.getElementById(
        "totalData"
    ).textContent = total;


    document.getElementById(
        "totalAktif"
    ).textContent = aktif;


    document.getElementById(
        "totalTidakAktif"
    ).textContent = tidakAktif;

}


/* =========================================
   TAMPILKAN DATA
========================================= */

function tampilkanData() {

    const mulai =
        (halaman - 1) *
        perHalaman;


    const akhir =
        mulai + perHalaman;


    const dataHalaman =
        dataTampil.slice(
            mulai,
            akhir
        );


    if (
        dataHalaman.length === 0
    ) {

        tabel.innerHTML = `

            <tr>

                <td colspan="9">

                    <div class="empty">

                        <i class="bi bi-inbox"></i>

                        <h3>
                            Data tidak ditemukan
                        </h3>

                    </div>

                </td>

            </tr>

        `;


        document.getElementById(
            "jumlahTampil"
        ).textContent =
            "0 data";


        buatPagination();

        return;

    }


    tabel.innerHTML =
        dataHalaman
        .map(
            (item, index) => {

                const nomor =
                    mulai +
                    index +
                    1;


                const aktif =
                    String(item.status)
                    .toLowerCase()
                    .includes("aktif")
                    &&
                    !String(item.status)
                    .toLowerCase()
                    .includes("tidak");


                return `

                    <tr>

                        <td>
                            ${nomor}
                        </td>

                        <td>
                            ${escapeHTML(item.nik)}
                        </td>

                        <td>
                            ${escapeHTML(item.kk)}
                        </td>

                        <td>
                            <strong>
                                ${escapeHTML(item.nama)}
                            </strong>
                        </td>

                        <td>
                            ${escapeHTML(item.alamat)}
                        </td>

                        <td>
                            ${escapeHTML(item.rt)}
                        </td>

                        <td>

                            <span class="status ${
                                aktif
                                ? "status-aktif"
                                : "status-tidak"
                            }">

                                ${escapeHTML(
                                    item.status
                                )}

                            </span>

                        </td>

                        <td>
                            ${escapeHTML(
                                item.keterangan
                            )}
                        </td>

                        <td>

                            <div class="aksi">

                                <button
                                    class="btn-action btn-edit"
                                    title="Edit"
                                    onclick="bukaEdit(${item._row})">

                                    <i class="bi bi-pencil"></i>

                                </button>


                                <button
                                    class="btn-action btn-delete"
                                    title="Hapus"
                                    onclick="hapusData(${item._row})">

                                    <i class="bi bi-trash"></i>

                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            }
        )
        .join("");


    document.getElementById(
        "jumlahTampil"
    ).textContent =
        `${dataTampil.length} data`;


    buatPagination();

}


/* =========================================
   PAGINATION
========================================= */

function buatPagination() {

    const container =
        document.getElementById(
            "pagination"
        );


    const totalHalaman =
        Math.ceil(
            dataTampil.length /
            perHalaman
        );


    if (
        totalHalaman <= 1
    ) {

        container.innerHTML = "";

        return;

    }


    container.innerHTML = `

        <button
            onclick="ubahHalaman(${halaman - 1})"
            ${halaman === 1 ? "disabled" : ""}>

            <i class="bi bi-chevron-left"></i>

        </button>


        <span class="page-info">

            Halaman
            ${halaman}
            dari
            ${totalHalaman}

        </span>


        <button
            onclick="ubahHalaman(${halaman + 1})"
            ${
                halaman === totalHalaman
                ? "disabled"
                : ""
            }>

            <i class="bi bi-chevron-right"></i>

        </button>

    `;

}


function ubahHalaman(page) {

    const total =
        Math.ceil(
            dataTampil.length /
            perHalaman
        );


    if (
        page < 1 ||
        page > total
    ) {

        return;

    }


    halaman = page;

    tampilkanData();

}


/* =========================================
   PENCARIAN
========================================= */

searchInput.addEventListener(
    "input",
    function () {

        const keyword =
            this.value
            .toLowerCase()
            .trim();


        dataTampil =
            dataBLT.filter(
                item => {

                    return [

                        item.nik,

                        item.kk,

                        item.nama,

                        item.alamat,

                        item.rt,

                        item.status,

                        item.keterangan

                    ]
                    .join(" ")
                    .toLowerCase()
                    .includes(keyword);

                }
            );


        halaman = 1;

        tampilkanData();

    }
);


/* =========================================
   TAMBAH
========================================= */

function bukaTambah() {

    document.getElementById(
        "modalTitle"
    ).textContent =
        "Tambah Penerima BLT";


    document.getElementById(
        "rowNumber"
    ).value = "";


    document.getElementById(
        "formBLT"
    ).reset();


    document.getElementById(
        "modalBLT"
    ).classList.add("active");

}


/* =========================================
   EDIT
========================================= */

function bukaEdit(rowNumber) {

    const item =
        dataBLT.find(
            data =>
                Number(data._row) ===
                Number(rowNumber)
        );


    if (!item) {

        alert(
            "Data tidak ditemukan."
        );

        return;

    }


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Edit Data Penerima BLT";


    document.getElementById(
        "rowNumber"
    ).value =
        item._row;


    document.getElementById(
        "nik"
    ).value =
        item.nik;


    document.getElementById(
        "kk"
    ).value =
        item.kk;


    document.getElementById(
        "nama"
    ).value =
        item.nama;


    document.getElementById(
        "alamat"
    ).value =
        item.alamat;


    document.getElementById(
        "rt"
    ).value =
        item.rt;


    document.getElementById(
        "status"
    ).value =
        item.status;


    document.getElementById(
        "keterangan"
    ).value =
        item.keterangan;


    document.getElementById(
        "modalBLT"
    ).classList.add("active");

}


/* =========================================
   TUTUP MODAL
========================================= */

function tutupModal() {

    document.getElementById(
        "modalBLT"
    ).classList.remove("active");

}


/* =========================================
   SIMPAN DATA
========================================= */

async function simpanData() {

    const btn =
        document.getElementById(
            "btnSimpan"
        );


    const row =
        document.getElementById(
            "rowNumber"
        ).value;


   const data = {

    action:
        row
        ? "update"
        : "add",

    // WAJIB untuk halaman BLT
    program: PROGRAM,

    _row:
        row || "",

    nik:
        document.getElementById(
            "nik"
        ).value.trim(),

    kk:
        document.getElementById(
            "kk"
        ).value.trim(),

    "nama penerima":
        document.getElementById(
            "nama"
        ).value.trim(),

    alamat:
        document.getElementById(
            "alamat"
        ).value.trim(),

    rt:
        document.getElementById(
            "rt"
        ).value.trim(),

    status:
        document.getElementById(
            "status"
        ).value,

    keterangan:
        document.getElementById(
            "keterangan"
        ).value.trim()

};


    if (!data.nik) {

        alert(
            "NIK wajib diisi."
        );

        return;

    }


    if (!data["nama penerima"]) {

        alert(
            "Nama penerima wajib diisi."
        );

        return;

    }


    btn.disabled = true;


    btn.innerHTML = `

        <i class="bi bi-arrow-repeat"></i>

        Menyimpan...

    `;


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
                        JSON.stringify(data)

                }
            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Gagal menyimpan data"
            );

        }


        alert(
            result.message ||
            "Data berhasil disimpan."
        );


        tutupModal();


        await ambilDataBLT();


    } catch (error) {

        console.error(error);


        alert(
            "Gagal menyimpan data.\n\n" +
            error.message
        );

    }


    btn.disabled = false;


    btn.innerHTML = `

        <i class="bi bi-save"></i>

        Simpan

    `;

}


/* =========================================
   HAPUS DATA
========================================= */

async function hapusData(rowNumber) {

    const item =
        dataBLT.find(
            data =>
                Number(data._row) ===
                Number(rowNumber)
        );


    if (!item) {

        alert(
            "Data tidak ditemukan."
        );

        return;

    }


    const yakin =
        confirm(

            "Apakah Anda yakin ingin menghapus data:\n\n" +

            item.nama +

            "\n\nData yang dihapus tidak dapat dikembalikan."

        );


    if (!yakin) {

        return;

    }


    try {

        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "text/plain;charset=utf-8"

                    },

                    body:
    JSON.stringify({

        action:
            "delete",

        program:
            PROGRAM,

        _row:
            rowNumber

    })

                }
            );


        const result =
            await response.json();


        if (
            !result.success
        ) {

            throw new Error(
                result.message ||
                "Gagal menghapus data"
            );

        }


        alert(
            result.message ||
            "Data berhasil dihapus."
        );


        await ambilDataBLT();


    } catch (error) {

        console.error(error);


        alert(
            "Gagal menghapus data.\n\n" +
            error.message
        );

    }

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

   TUTUP MODAL KLIK LUAR
========================================= */

document
    .getElementById("modalBLT")
    .addEventListener(
        "click",
        function (event) {

            if (
                event.target === this
            ) {

                tutupModal();

            }

        }
    );


/* =========================================
   LOAD DATA PERTAMA
========================================= */

ambilDataBLT();


</script>
