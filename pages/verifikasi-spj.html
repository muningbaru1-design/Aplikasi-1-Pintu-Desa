<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi SPJ</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="../css/style.css">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',sans-serif;background:#f3f6fb;color:#1f2937}
.verifikasi-page{padding:30px}
.verifikasi-title{text-align:center;margin-bottom:25px}
.verifikasi-title h2{margin:0 0 5px}
.verifikasi-title p{color:#777;font-size:14px;margin:0}
.verifikasi-card{background:#fff;border-radius:15px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.08);overflow-x:auto}
.verifikasi-table{width:100%;border-collapse:collapse;min-width:1050px}
.verifikasi-table th{background:#0F766E;color:#fff;padding:13px 10px;font-size:13px;text-align:center;white-space:nowrap}
.verifikasi-table td{padding:12px 10px;border-bottom:1px solid #e5e7eb;font-size:13px;vertical-align:middle}
.verifikasi-table tbody tr:hover{background:#f0fdfa}
.nomor{text-align:center;width:50px}
.status{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.status-lengkap{background:#DCFCE7;color:#166534}
.status-belum{background:#FEE2E2;color:#991B1B}
.aksi{display:flex;justify-content:center;gap:6px}
.btn-action{width:35px;height:35px;border:0;border-radius:8px;color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:15px;transition:.2s}
.btn-action:hover{transform:translateY(-1px)}
.btn-edit{background:#2563eb}
.btn-edit:hover{background:#1d4ed8}
.empty{text-align:center;padding:35px 20px;color:#6b7280}
.empty i{font-size:35px}
.empty h3{margin:8px 0 4px;color:#374151}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:15px;z-index:10000}
.modal.active{display:flex}
.modal-box{background:#fff;width:100%;max-width:700px;max-height:92vh;overflow-y:auto;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-head{padding:18px 20px;background:#0F766E;color:#fff;display:flex;align-items:center;justify-content:space-between}
.modal-head h3{margin:0;font-size:18px}
.modal-close{border:0;background:transparent;color:#fff;font-size:23px;cursor:pointer}
.form{padding:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:13px;font-weight:600;color:#374151}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;outline:0;font-family:'Poppins',sans-serif;font-size:13px}
.form-group textarea{min-height:85px;resize:vertical}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#0F766E;box-shadow:0 0 0 3px rgba(15,118,110,.08)}
.form-group.full{grid-column:1/-1}
.modal-footer{padding:15px 20px;border-top:1px solid #e5e7eb;display:flex;justify-content:flex-end;gap:10px;grid-column:1/-1}
.btn{border:0;border-radius:9px;padding:10px 15px;font-family:'Poppins',sans-serif;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn-gray{background:#6b7280;color:#fff}
.btn-save{background:#0F766E;color:#fff}
.btn:disabled{opacity:.7;cursor:not-allowed}
@media(max-width:700px){
.verifikasi-page{padding:15px}.verifikasi-card{padding:10px}
.verifikasi-title h2{font-size:19px}.verifikasi-title p{font-size:12px}
.form{grid-template-columns:1fr;padding:15px}.form-group.full{grid-column:auto}
.modal-box{max-height:95vh}.modal-footer{grid-column:auto}
}
</style>
</head>

<body>

<header class="header">
<button class="menu-btn" onclick="history.back()"><i class="bi bi-arrow-left"></i></button>
<div class="title">
<h2>Verifikasi SPJ</h2>
<p>Verifikasi Kelengkapan SPJ Desa</p>
</div>
<img src="../assets/logo/logo-desa.jpg" class="logo-desa">
</header>

<main class="verifikasi-page">
<div class="verifikasi-title">
<h2>VERIFIKASI SPJ</h2>
<p>Daftar pemeriksaan kelengkapan Surat Pertanggungjawaban</p>
</div>

<div class="verifikasi-card">
<table class="verifikasi-table">
<thead>
<tr>
<th>No</th>
<th>SPJ Bulan</th>
<th>Nomor Kwitansi</th>
<th>Kekurangan SPJ</th>
<th>Pelaksana Kegiatan</th>
<th>Keterangan</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="tabelSPJ">
<tr><td colspan="7"><div class="empty"><i class="bi bi-arrow-repeat"></i><h3>Memuat data...</h3><p>Mohon tunggu.</p></div></td></tr>
</tbody>
</table>
</div>
</main>

<div class="modal" id="modalEditSPJ">
<div class="modal-box">
<div class="modal-head">
<h3>Edit Verifikasi SPJ</h3>
<button type="button" class="modal-close" onclick="tutupEditSPJ()"><i class="bi bi-x-lg"></i></button>
</div>

<form class="form" id="formEditSPJ" onsubmit="event.preventDefault(); simpanEditSPJ();">
<input type="hidden" id="editRow">

<div class="form-group">
<label>No</label>
<input type="text" id="editNo">
</div>

<div class="form-group">
<label>SPJ Bulan</label>
<input type="text" id="editBulan" required>
</div>

<div class="form-group">
<label>Nomor Kwitansi</label>
<input type="text" id="editKwitansi">
</div>

<div class="form-group">
<label>Pelaksana Kegiatan</label>
<input type="text" id="editPelaksana">
</div>

<div class="form-group full">
<label>Kekurangan SPJ</label>
<textarea id="editKekurangan"></textarea>
</div>

<div class="form-group full">
<label>Keterangan</label>
<select id="editKeterangan">
<option value="Lengkap">Lengkap</option>
<option value="Belum Lengkap">Belum Lengkap</option>
</select>
</div>

<div class="modal-footer">
<button type="button" class="btn btn-gray" onclick="tutupEditSPJ()">Batal</button>
<button type="submit" class="btn btn-save" id="btnSimpanEdit">
<i class="bi bi-save"></i> Simpan Perubahan
</button>
</div>
</form>
</div>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzUxT-kHO1LxecdJN6aqwDJT86NIGn5yVFNv3X8Nq2YZiwveTZK9ee4SzcC43PuQXgJ/exec";

let dataSPJ=[];

function escapeHTML(value){
if(value===null||value===undefined)return "";
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

async function loadVerifikasiSPJ(){
const tabel=document.getElementById("tabelSPJ");

tabel.innerHTML=`<tr><td colspan="7"><div class="empty"><i class="bi bi-arrow-repeat"></i><h3>Memuat data SPJ...</h3><p>Mohon tunggu.</p></div></td></tr>`;

try{
const response=await fetch(API_URL+"?action=verifikasi&t="+Date.now());

if(!response.ok)throw new Error("Gagal mengambil data");

const data=await response.json();

if(!Array.isArray(data)){
throw new Error(data.message||data.error||"Format data dari API tidak valid");
}

dataSPJ=data;
tabel.innerHTML="";

if(dataSPJ.length===0){
tabel.innerHTML=`<tr><td colspan="7"><div class="empty"><i class="bi bi-inbox"></i><h3>Belum ada data</h3><p>Belum ada data verifikasi SPJ.</p></div></td></tr>`;
return;
}

dataSPJ.forEach((item,index)=>{
const keterangan=String(item.keterangan||"").trim().toLowerCase();

let statusHTML;

if(keterangan==="lengkap"){
statusHTML=`<span class="status status-lengkap"><i class="bi bi-check-circle-fill"></i> Lengkap</span>`;
}else{
statusHTML=`<span class="status status-belum"><i class="bi bi-exclamation-circle-fill"></i> Belum Lengkap</span>`;
}

tabel.innerHTML+=`
<tr>
<td class="nomor">${escapeHTML(item.no||index+1)}</td>
<td>${escapeHTML(item.bulan||"-")}</td>
<td>${escapeHTML(item.kwitansi||"-")}</td>
<td>${escapeHTML(item.kekurangan||"-")}</td>
<td>${escapeHTML(item.pelaksana||"-")}</td>
<td>${statusHTML}</td>
<td>
<div class="aksi">
<button type="button" class="btn-action btn-edit" title="Edit" onclick="bukaEditSPJ(${Number(item._row)})">
<i class="bi bi-pencil"></i>
</button>
</div>
</td>
</tr>`;
});

}catch(error){
console.error("Verifikasi SPJ:",error);
tabel.innerHTML=`<tr><td colspan="7"><div class="empty" style="color:#b91c1c"><i class="bi bi-exclamation-triangle"></i><h3>Gagal mengambil data</h3><p>${escapeHTML(error.message||"Periksa koneksi API.")}</p></div></td></tr>`;
}
}

function bukaEditSPJ(rowNumber){
const item=dataSPJ.find(data=>Number(data._row)===Number(rowNumber));

if(!item){
alert("Data SPJ tidak ditemukan.");
return;
}

document.getElementById("editRow").value=item._row;
document.getElementById("editNo").value=item.no||"";
document.getElementById("editBulan").value=item.bulan||"";
document.getElementById("editKwitansi").value=item.kwitansi||"";
document.getElementById("editKekurangan").value=item.kekurangan||"";
document.getElementById("editPelaksana").value=item.pelaksana||"";
document.getElementById("editKeterangan").value=item.keterangan||"Belum Lengkap";
document.getElementById("modalEditSPJ").classList.add("active");
}

function tutupEditSPJ(){
document.getElementById("modalEditSPJ").classList.remove("active");
}

async function simpanEditSPJ(){
const btn=document.getElementById("btnSimpanEdit");
const row=document.getElementById("editRow").value;

if(!row){
alert("Nomor baris tidak ditemukan.");
return;
}

const data={
action:"update",
_row:Number(row),
no:document.getElementById("editNo").value.trim(),
bulan:document.getElementById("editBulan").value.trim(),
kwitansi:document.getElementById("editKwitansi").value.trim(),
kekurangan:document.getElementById("editKekurangan").value.trim(),
pelaksana:document.getElementById("editPelaksana").value.trim(),
keterangan:document.getElementById("editKeterangan").value
};

if(!data.bulan){
alert("SPJ Bulan wajib diisi.");
return;
}

btn.disabled=true;
btn.innerHTML='<i class="bi bi-arrow-repeat"></i> Menyimpan...';

try{
const response=await fetch(API_URL,{
method:"POST",
headers:{"Content-Type":"text/plain;charset=utf-8"},
body:JSON.stringify(data)
});

const result=await response.json();

if(!result.success){
throw new Error(result.message||result.error||"Gagal memperbarui data.");
}

alert(result.message||"Data berhasil diperbarui.");
tutupEditSPJ();
await loadVerifikasiSPJ();

}catch(error){
console.error("Update SPJ:",error);
alert("Gagal memperbarui data.\n\n"+(error.message||"Terjadi kesalahan."));
}

btn.disabled=false;
btn.innerHTML='<i class="bi bi-save"></i> Simpan Perubahan';
}

document.getElementById("modalEditSPJ").addEventListener("click",function(event){
if(event.target===this)tutupEditSPJ();
});

loadVerifikasiSPJ();
</script>

</body>
</html>
